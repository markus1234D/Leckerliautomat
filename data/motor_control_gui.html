<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>GUI mit Grid</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
    }
    h1 {
      text-align: center;
    }
    .row-container {
      display: flex; /* Flexbox aktivieren */
      flex-wrap: wrap;
      /* Bei schmalen Bildschirmen in Spalten anordnen. */
      /* @media screen and (max-width: 1000px) {
        flex-direction: column;
      } */
      gap: 20px;
      justify-content: center;
      text-align: center;
      width: 90%;
    }

    .column-container {
      flex: 1; /* Gleichmäßige Breite für alle Spalten */
      display: flex;
      flex-direction: column; /* Spaltenanordnung */
      border-color: #4CAF50;
      border-style: solid;
      border-width: 2px;
      color: white;
      text-align: center;
      padding: 20px;
      border-radius: 8px;
      align-items: center;
      justify-content: center;
      width: 100%;
    }
    .slider {
      width: 60%;
      margin: 10px 0;
      min-width: 200px; /* Mindestbreite für den Slider */
    }
    .number-input {
      width: 100px; /* Breite für die Eingabefelder */
      margin: 10px 0;
      max-width: 80px; /* Maximale Breite für die Eingabefelder */
    }
    .button {
      padding: 10px 20px;
      margin: 10px;
      background-color: #4CAF50;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="page">
    <h1>Leckerliautomat GUI</h1>
    <div class="row-container">
      <div class="column-container">
        <h2>Speed Control</h2>
        <div class="row-container">
          <label for="speedSlider" id="minSpeedLabel">-100%</label>
          <input type="range" id="speedSlider" class="slider" min="-100" max="100" aria-label="Speed Slider" >
          <label for="speedSlider" id="maxSpeedLabel">100%</label>
        </div>
        <label for="speedSlider" id="speedSliderValue">50%</label>
        <div class="row-container">
            <button class="button" type="button" id="stopGoBtn">stop/go</button>
        </div>
      </div>

      <div class="column-container">
        <h3>Speed/Time Control</h3>
        <div class="row-container">
          <h4>Speed</h4>
        </div>
        <div class="row-container">
          <label for="speedSlider2" id="minSpeedLabel">-100%</label>
          <input type="range" id="speedSlider2" class="slider" min="-100" max="100" aria-label="Speed Slider" >
          <label for="speedSlider2" id="maxSpeedLabel">100%</label>
        </div> 
        <label for="speedSlider2" id="speedSlider2Value">50%</label>
        <div class="row-container">
          <h4>Time</h4>
        </div>
        <div class="row-container">
          <label for="timeSlider" id="minTimeLabel">0 s</label>
          <input type="range" id="timeSlider" class="slider" min="0" max="20" step="0.5" aria-label="Time Slider">
          <label for="timeSlider" id="maxTimeLabel">20 s</label>
        </div>
        <label for="timeSlider" id="timeSliderValue">1.5 s</label>
        <div class="row-container">
          <button class="button" id="fireBtn">Fire</button>
        </div>
      </div>
    </div>
  </div>

    <script>

      // const slider = document.getElementById("zoomSlider"); 
      // const page = document.getElementById("page"); 
      // slider.addEventListener("input", function() { 
      //   const scale = slider.value / 100; 
      //   page.style.transform = `scale(${scale})`; });
      
        // communication stuff
        //protokol: command?arg1=value1&arg2=value2...
        var ws = new WebSocket('ws://' + window.location.hostname + ':81');

        ws.onopen = function() {
            console.log("Websocket connected");
        };
        ws.onmessage = function (evt) {
            const command = extractCommand(evt.data);
            const { argNames, args } = extractArgs(evt.data);
            console.log("Command: " + command);
            console.log("ArgNames: " + argNames);
            console.log("Args: " + args);
        }

        function extractCommand(input) {
            const pos = input.indexOf('?');
            if (pos !== -1) {
                return input.substring(0, pos);
            } else {
                return input; // Wenn kein '?' gefunden wird, ist der ganze String der Command
            }
        }

        function extractArgs(input) {
            const argNames = [];
            const args = [];
            
            const pos = input.indexOf('?');
            if (pos === -1) return { argNames, args }; // Falls kein '?' vorhanden ist, keine Argumente

            const query = input.substring(pos + 1);
            const pairs = query.split('&');

            pairs.forEach(pair => {
                const [name, value] = pair.split('=');
                if (name && value) {
                    argNames.push(name);
                    args.push(value);
                }
            });
            return { argNames, args };
        }
        // end communication stuff

        const speedSlider = document.getElementById("speedSlider");
        const speedSlider2 = document.getElementById("speedSlider2");
        const timeSlider = document.getElementById("timeSlider");
        const speedSliderValue = document.getElementById("speedSliderValue");
        const speedSlider2Value = document.getElementById("speedSlider2Value");
        const timeSliderValue = document.getElementById("timeSliderValue");
        const stopGoButton = document.getElementById("stopGoBtn");
        const fireButton = document.getElementById("fireBtn");

        speedSliderValue.textContent = speedSlider.value + "%";
        speedSlider2Value.textContent = speedSlider2.value + "%";
        timeSliderValue.textContent = timeSlider.value + " s";

        stopGoButton.addEventListener("mousedown", motorGo);
        stopGoButton.addEventListener("mouseup", motorStop);
        fireButton.addEventListener("click", fire);
        speedSlider.addEventListener("input", () => {
            speedSliderValue.textContent = speedSlider.value + "%";
        });
        speedSlider2.addEventListener("input", () => {
            speedSlider2Value.textContent = speedSlider2.value + "%";
        });
        timeSlider.addEventListener("input", () => {
            timeSliderValue.textContent = timeSlider.value + " s";
        });

        function fire() {
            const speed = speedSlider2.value;
            const time = timeSlider.value;
            const url = `fire?speed=${speed}&time=${time}`;
            console.log("ws send: " + url);
            ws.send(url);
        }

        function motorGo() {
            const speed = speedSlider2.value;
            const time = timeSlider.value;
            const url = `motorGo?speed=${speed}&time=${time}`;
            console.log("ws send: " + url);
            ws.send(url);
        }
        function motorStop() {
            const url = "motorStop";
            console.log("ws send: " + url);
            ws.send(url);
        }
        
    </script>
</body>
</html>
